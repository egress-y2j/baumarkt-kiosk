<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baumarkt Kiosk – Prototyp</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffc400">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e9ea;--card:#fff;--ink:#1f2a30;--mute:#58666e;--line:#c9d0d3;--acc:#ffc400;--on-acc:#1f2a30;--ok:#2a9548;--mid:#e59f00;--bad:#d4372b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#182025;--card:#25313a;--ink:#eef1f2;--mute:#a4b1b8;--line:#3a4852}}
:root[data-theme="dark"]{--bg:#182025;--card:#25313a;--ink:#eef1f2;--mute:#a4b1b8;--line:#3a4852}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 20px/1.4 Barlow,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
h1,h2,.logo{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:46px;line-height:1.05}h2{font-size:32px}
#root{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--card);border-bottom:4px solid var(--acc)}
.logo{font-size:30px;display:flex;align-items:center;gap:10px;flex:1}
.mark{width:34px;height:34px;background:var(--acc);display:grid;place-items:center;font-size:20px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 20px;min-height:48px}
.chip:focus-visible,.btn:focus-visible,.tile:focus-visible,.row:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #2d7ff9;outline-offset:2px}
main{flex:1;overflow:auto;padding:28px 36px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px;text-align:left;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile:active,.row:active{transform:scale(.98);border-color:var(--acc)}
.tile .ic{font-size:54px;line-height:1}
.tile b{font:700 32px/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.tile small{color:var(--mute);font-size:18px}
.tile.main{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.tile.main small{color:var(--on-acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px 22px;margin-bottom:12px;text-align:left}
.gang{background:var(--ink);color:var(--card);border-radius:8px;padding:4px 14px;font:700 26px "Barlow Condensed","Arial Narrow",Arial,sans-serif;white-space:nowrap}
.price{font-weight:600;white-space:nowrap}
.mute{color:var(--mute)}
.btn{background:var(--acc);color:var(--on-acc);border:0;border-radius:12px;padding:16px 34px;font-weight:600;min-height:60px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.45}
input[type=search],input[type=email],input[type=password],textarea{width:100%;font:inherit;padding:16px 20px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{min-height:150px;resize:none}
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:30px 0}
.light{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:30px 10px;text-align:center;font-weight:600}
.light i{display:block;font-style:normal;font-size:64px;line-height:1.2}
.light span{display:block;width:70px;height:70px;border-radius:50%;margin:0 auto 12px}
.light:active{border-color:var(--ink)}
.light.sel{border-color:var(--ink);box-shadow:0 0 0 4px var(--acc)}
.detail{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:34px;align-items:start;max-width:1000px}
.pic{background:var(--card);border:2px solid var(--line);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;font-size:120px}
.big{display:flex;align-items:center;gap:16px;margin:18px 0}
.check{display:flex;gap:14px;align-items:flex-start;margin:18px 0}
.check input{width:34px;height:34px;flex:none;accent-color:#1f6fe0}
.qr{width:64px;height:64px;border:2px dashed var(--line);display:grid;place-items:center;font-size:14px;color:var(--mute);flex:none}
.steps{color:var(--mute);margin-bottom:6px}
.overlay{position:fixed;inset:0;background:rgba(15,22,26,.9);color:#fff;display:none;place-items:center;text-align:center;z-index:20;padding:30px}
.overlay.on{display:grid}
.panel{background:var(--card);color:var(--ink);border-radius:16px;padding:28px;max-width:560px;width:100%;text-align:left}
@media (max-width:700px){main{padding:20px}.detail{grid-template-columns:1fr}h1{font-size:36px}.lights{gap:10px}.light span{width:48px;height:48px}}
@media (prefers-reduced-motion:no-preference){.tile,.row{transition:transform .08s}}
</style>
</head>
<body>
<div id="root">
<header>
  <button class="chip" id="back" hidden></button>
  <div class="logo" id="logo"><div class="mark">🔧</div>Baumarkt Muster</div>
  <button class="chip" id="lang" aria-label="Sprache wechseln">EN</button>
</header>
<main id="main"></main>
</div>
<div class="overlay" id="attract"><div><h1 id="attractT"></h1><p id="attractS" class="mute"></p></div></div>
<div class="overlay" id="admin"><div class="panel" id="adminBox"></div></div>

<script>
// Einstellungen (zum Testen kürzer setzen)
var IDLE_RESET = 45000, IDLE_ATTRACT = 90000, PIN = "1234";

var T = {
 de:{back:"Zurück",home:"Start",welcome:"Wie können wir helfen?",hSub:"Tippen Sie auf eine Kachel.",
  discover:"Produkte entdecken",discoverS:"Nach Kategorien stöbern",search:"Produkt suchen",searchS:"Name eintippen",
  aisles:"Wo finde ich …?",aislesS:"Gänge im Überblick",fb:"Feedback geben",fbS:"Ihre Meinung zählt",
  cats:"Kategorien",aisle:"Gang",price:"Preis",findIn:"Zu finden in",searchPh:"Zum Beispiel „Bohrschrauber“",
  none:"Nichts gefunden. Bitte fragen Sie einen Mitarbeiter.",items:"Artikel",
  q1:"Wie zufrieden sind Sie insgesamt mit Ihrem Besuch?",q2:"Wie zufrieden sind Sie mit unserer Produktauswahl?",q3:"Wie zufrieden sind Sie mit dem Service?",
  q:"Frage",of:"von",good:"Gut",ok:"Geht so",bad:"Schlecht",cph:"Kommentar (freiwillig), z. B. Lob oder Wunsch",cnote:"Bitte keine persönlichen Daten eintragen.",lblA:"Besuch",lblP:"Auswahl",lblS:"Service",lblC:"Sonstiges",
  commentT:"Möchten Sie uns noch etwas mitteilen?",commentP:"Ihre Anmerkung (freiwillig)",next:"Weiter",skip:"Überspringen",
  nlT:"Newsletter erhalten?",nlS:"Freiwillig. Wir informieren Sie über Angebote.",email:"E-Mail-Adresse",
  consent:"Ich willige ein, den Newsletter per E-Mail zu erhalten. Ich kann die Einwilligung jederzeit widerrufen.",
  privacy:"Datenschutzerklärung: baumarkt-muster.example/datenschutz",bad_email:"Bitte geben Sie eine gültige E-Mail-Adresse ein.",
  send:"Feedback absenden",thanks:"Vielen Dank!",thanksS:"Wir kehren gleich zum Start zurück.",toStart:"Zum Start",
  attractT:"Tippen Sie, um zu starten",attractS:"Produkte finden · Gänge sehen · Feedback geben",
  pinT:"Admin-Zugang",pinP:"PIN eingeben",open:"Öffnen",close:"Schließen",wipe:"Daten löschen",lastC:"Letzte Anmerkungen",
  total:"Feedbacks",nlCount:"Newsletter-Anmeldungen (separat gespeichert)",wrong:"PIN falsch."},
 en:{back:"Back",home:"Home",welcome:"How can we help?",hSub:"Tap a tile.",
  discover:"Discover products",discoverS:"Browse by category",search:"Find a product",searchS:"Type a name",
  aisles:"Where can I find …?",aislesS:"Aisles at a glance",fb:"Give feedback",fbS:"Your opinion matters",
  cats:"Categories",aisle:"Aisle",price:"Price",findIn:"Find it in",searchPh:"For example “drill”",
  none:"Nothing found. Please ask a team member.",items:"items",
  q1:"How satisfied are you with your visit overall?",q2:"How satisfied are you with our product range?",q3:"How satisfied are you with our service?",
  q:"Question",of:"of",good:"Good",ok:"So-so",bad:"Poor",cph:"Comment (optional), e.g. praise or a wish",cnote:"Please do not enter personal data.",lblA:"Visit",lblP:"Range",lblS:"Service",lblC:"Other",
  commentT:"Anything else you would like to tell us?",commentP:"Your comment (optional)",next:"Next",skip:"Skip",
  nlT:"Receive our newsletter?",nlS:"Optional. We will tell you about offers.",email:"Email address",
  consent:"I agree to receive the newsletter by email. I can withdraw my consent at any time.",
  privacy:"Privacy policy: baumarkt-muster.example/datenschutz",bad_email:"Please enter a valid email address.",
  send:"Send feedback",thanks:"Thank you!",thanksS:"Returning to the start screen shortly.",toStart:"Back to start",
  attractT:"Tap to start",attractS:"Find products · See aisles · Give feedback",
  pinT:"Admin access",pinP:"Enter PIN",open:"Open",close:"Close",wipe:"Delete data",lastC:"Latest comments",
  total:"Feedback entries",nlCount:"Newsletter sign-ups (stored separately)",wrong:"Wrong PIN."}
};

// Daten kommen aus shops/<id>.json (siehe loadShop)
var CATS = [], PRODS = [], GANGS = [], SHOP = {}, SID = "demo";

var L = "de", V = {n:"home"}, FB = {}, tReset, tAttract, tThanks;
var $ = function(s){return document.querySelector(s)}, M = $("#main");
function t(k){return T[L][k]||k}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cat(i){return esc(CATS[i][L==="de"?1:2])}
function store(k,v){try{var a=JSON.parse(localStorage.getItem(k)||"[]");if(v){a.push(v);localStorage.setItem(k,JSON.stringify(a))}return a}catch(e){return []}}

function gCats(g){var o=[];PRODS.forEach(function(p){var n=CATS[p[1]][1];if(p[4]===g&&o.indexOf(n)<0)o.push(n)});return o.join(" · ")}
function gOfCat(c){var o=[];PRODS.forEach(function(p){if(p[1]===c&&o.indexOf(p[4])<0)o.push(p[4])});return o.join(", ")}
function applyShop(d){
  SHOP=d;var names=d.categories.map(function(c){return c.name});
  CATS=d.categories.map(function(c){return [c.icon||"📦",c.name,c.name]});
  PRODS=d.products.map(function(p){return [p.name,names.indexOf(p.category),p.price||"",p.description||"",String(p.aisle||"")]}).filter(function(p){return p[1]>-1});
  GANGS=[];PRODS.forEach(function(p){if(GANGS.indexOf(p[4])<0)GANGS.push(p[4])});
  GANGS.sort(function(a,b){return a.localeCompare(b,"de",{numeric:true})});
  if(d.accent){var r=document.documentElement.style;r.setProperty("--acc",d.accent);r.setProperty("--on-acc",d.accentText||"#1f2a30")}
  $("#logo").innerHTML='<div class="mark">'+esc(d.logo||"🛒")+'</div>'+esc(d.name||"Kiosk");
  document.title=(d.name||"Kiosk")+" – Kiosk";
  render();
}
function loadShop(){
  SID=(new URLSearchParams(location.search).get("shop")||"demo").replace(/[^a-zA-Z0-9_-]/g,"");
  fetch("shops/"+SID+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(applyShop).catch(function(){
    M.innerHTML='<h1>Daten konnten nicht geladen werden</h1><p class="mute">Bitte Internetverbindung prüfen und die Seite neu laden. (Laden: '+esc(SID)+')</p>';
  });
}
function go(n,p){clearTimeout(tThanks);V=Object.assign({n:n},p||{});render();M.scrollTop=0}
function tile(cls,ic,title,sub,act){return '<button class="tile '+cls+'" onclick="'+act+'"><span class="ic">'+ic+'</span><span><b>'+title+'</b><br><small>'+sub+'</small></span></button>'}
function prodRow(i){var p=PRODS[i];return '<button class="row" onclick="go(\'prod\',{i:'+i+'})"><span><b>'+esc(p[0])+'</b><br><span class="mute">'+esc(p[3])+'</span></span><span class="price">'+esc(p[2])+' €</span></button>'}

function render(){
  $("#back").hidden = V.n==="home"; $("#back").textContent = "← "+t("back");
  $("#lang").textContent = L==="de"?"EN":"DE";
  var h = "";
  if(V.n==="home"){
    h = '<h1>'+t("welcome")+'</h1><p class="mute">'+t("hSub")+'</p><div class="grid" style="margin-top:22px">'+
      tile("main","🧰",t("discover"),t("discoverS"),"go('cats')")+tile("","🔎",t("search"),t("searchS"),"go('search')")+
      tile("","🧭",t("aisles"),t("aislesS"),"go('aisles')")+tile("","💬",t("fb"),t("fbS"),"startFb()")+'</div>';
  }else if(V.n==="cats"){
    h = '<h2>'+t("cats")+'</h2><div class="grid" style="margin-top:18px">'+CATS.map(function(c,i){return tile("",esc(c[0]),cat(i),PRODS.filter(function(p){return p[1]===i}).length+" "+t("items"),"go('list',{c:"+i+"})")}).join("")+'</div>';
  }else if(V.n==="list"){
    var byG = V.g!==undefined, ttl = byG?esc(t("aisle")+" "+GANGS[V.g]):cat(V.c);
    h = '<h2>'+ttl+'</h2><p class="mute">'+(byG?esc(gCats(GANGS[V.g])):esc(t("aisle")+" "+gOfCat(V.c)))+'</p>'+PRODS.map(function(p,i){return (byG?p[4]===GANGS[V.g]:p[1]===V.c)?prodRow(i):""}).join("");
  }else if(V.n==="prod"){
    var p = PRODS[V.i];
    h = '<div class="detail"><div class="pic">'+esc(CATS[p[1]][0])+'</div><div><h1>'+esc(p[0])+'</h1><p>'+esc(p[3])+'</p><div class="big"><span class="gang">'+t("aisle")+" "+esc(p[4])+'</span><span>'+t("findIn")+" "+cat(p[1])+'</span></div><p class="price" style="font-size:34px;margin:0">'+esc(p[2])+' €</p></div></div>';
  }else if(V.n==="search"){
    h = '<h2>'+t("search")+'</h2><div style="margin:16px 0"><input type="search" id="q" placeholder="'+t("searchPh")+'" autocomplete="off" oninput="doSearch()"></div><div id="res"></div>';
  }else if(V.n==="aisles"){
    h = '<h2>'+t("aisles")+'</h2><div style="margin-top:18px">'+GANGS.map(function(g,i){var n=PRODS.filter(function(p){return p[4]===g}).length;
      return '<button class="row" onclick="go(\'list\',{g:'+i+'})"><span style="display:flex;align-items:center;gap:18px"><span class="gang">'+t("aisle")+" "+esc(g)+'</span><b>'+esc(gCats(g))+'</b></span><span class="mute">'+n+" "+t("items")+'</span></button>'}).join("")+'</div>';
  }else if(V.n==="fb"){
    var s = V.s;
    if(s<=3){
      var cur = FB["r"+s];
      h = '<div class="steps">'+t("q")+" "+s+" "+t("of")+" 3</div><h1>"+t("q"+s)+"</h1>"+
        '<div class="lights" style="margin:20px 0">'+[[2,"var(--ok)","🙂","good"],[1,"var(--mid)","😐","ok"],[0,"var(--bad)","🙁","bad"]].map(function(o){
        return '<button class="light'+(cur===o[0]?' sel':'')+'" onclick="pick('+s+','+o[0]+')"><span style="background:'+o[1]+'"></span><i>'+o[2]+'</i>'+t(o[3])+'</button>'}).join("")+'</div>'+
        '<div style="max-width:900px"><textarea id="cq" maxlength="300" style="min-height:100px" placeholder="'+t("cph")+'">'+esc(FB["c"+s]||"")+'</textarea><p class="mute" style="margin:6px 0 0;font-size:16px">'+t("cnote")+'</p></div>'+
        '<button class="btn" id="nx" style="margin-top:18px" onclick="nextQ('+s+')"'+(cur===undefined?' disabled':'')+'>'+t("next")+'</button>';
    }else if(s===4){
      h = '<h1>'+t("commentT")+'</h1><div style="max-width:800px;margin:24px 0"><textarea id="cm" maxlength="500" placeholder="'+t("commentP")+'">'+esc(FB.c||"")+'</textarea></div><button class="btn" onclick="FB.c=$(\'#cm\').value.trim();go(\'fb\',{s:5})">'+t("next")+'</button> <button class="btn alt" onclick="FB.c=\'\';go(\'fb\',{s:5})">'+t("skip")+'</button>';
    }else if(s===5){
      h = '<h1>'+t("nlT")+'</h1><p class="mute">'+t("nlS")+'</p><div style="max-width:800px"><input type="email" id="em" placeholder="'+t("email")+'" autocomplete="off">'+
        '<label class="check"><input type="checkbox" id="co"><span>'+t("consent")+'</span></label><div class="check" style="align-items:center"><div class="qr">QR</div><span class="mute">'+t("privacy")+'</span></div>'+
        '<p id="err" style="color:var(--bad);min-height:1.4em;margin:0 0 10px"></p></div><button class="btn" onclick="finish(true)">'+t("send")+'</button> <button class="btn alt" onclick="finish(false)">'+t("skip")+'</button>';
    }else{
      h = '<div style="text-align:center;padding-top:60px"><div style="font-size:90px">🙌</div><h1>'+t("thanks")+'</h1><p class="mute">'+t("thanksS")+'</p><button class="btn" onclick="go(\'home\')">'+t("toStart")+'</button></div>';
      tThanks = setTimeout(function(){go("home")},6000);
    }
  }
  M.innerHTML = h;
  if(V.n==="search"){doSearch()}
}
function doSearch(){
  var q = ($("#q")?$("#q").value:"").trim().toLowerCase(), r = $("#res");
  var hits = PRODS.map(function(p,i){return i}).filter(function(i){var p=PRODS[i];return !q||(p[0]+" "+p[3]+" "+CATS[p[1]][1]).toLowerCase().indexOf(q)>-1});
  r.innerHTML = hits.length?hits.map(prodRow).join(""):'<p class="mute">'+t("none")+'</p>';
}
function startFb(){FB={};go("fb",{s:1})}
function pick(s,v){FB["r"+s]=v;var b=document.querySelectorAll(".light");[2,1,0].forEach(function(x,i){b[i].classList.toggle("sel",x===v)});$("#nx").disabled=false}
function nextQ(s){var c=$("#cq");FB["c"+s]=c?c.value.trim():"";go("fb",{s:s+1})}
function finish(withMail){
  if(withMail){
    var m = $("#em").value.trim(), ok = $("#co").checked;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(m)||!ok){$("#err").textContent=/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(m)?t("consent"):t("bad_email");return}
    store("nl",{email:m,ts:Date.now()});   // getrennt vom Feedback, keine Verknüpfung
  }
  store("fb",{a:FB.r1,p:FB.r2,s:FB.r3,c:FB.c||"",ca:FB.c1||"",cp:FB.c2||"",cs:FB.c3||"",sh:SID,ts:Date.now()});
  FB = {}; go("fb",{s:6});
}

// Auto-Reset und Ruhemodus
function activity(){
  clearTimeout(tReset);clearTimeout(tAttract);$("#attract").classList.remove("on");
  tReset = setTimeout(function(){if(!$("#admin").classList.contains("on")&&V.n!=="home"){FB={};go("home")}},IDLE_RESET);
  tAttract = setTimeout(function(){if(!$("#admin").classList.contains("on")){FB={};go("home");$("#attract").classList.add("on")}},IDLE_ATTRACT);
}
["pointerdown","keydown"].forEach(function(e){document.addEventListener(e,activity,true)});

// Sprache
$("#lang").onclick = function(){L=L==="de"?"en":"de";document.documentElement.lang=L;$("#attractT").textContent=t("attractT");$("#attractS").textContent=t("attractS");render()};
$("#back").onclick = function(){
  if(V.n==="prod")go("list",{c:PRODS[V.i][1]});else if(V.n==="list")go(V.g!==undefined?"aisles":"cats");else if(V.n==="fb"&&V.s>1&&V.s<6){var cq=$("#cq");if(cq&&V.s<=3)FB["c"+V.s]=cq.value.trim();go("fb",{s:V.s-1})}else go("home");
};

// Versteckter Admin-Zugang: Logo 2 Sekunden gedrückt halten
var hold; var lg=$("#logo");
lg.addEventListener("pointerdown",function(){hold=setTimeout(openPin,2000)});
["pointerup","pointerleave","pointercancel"].forEach(function(e){lg.addEventListener(e,function(){clearTimeout(hold)})});
function openPin(){
  $("#adminBox").innerHTML='<h2>'+t("pinT")+'</h2><p><input type="password" id="pin" inputmode="numeric" placeholder="'+t("pinP")+'"></p><p id="perr" style="color:var(--bad);min-height:1.4em"></p><button class="btn" onclick="checkPin()">'+t("open")+'</button> <button class="btn alt" onclick="closeAdmin()">'+t("close")+'</button>';
  $("#admin").classList.add("on");
}
function closeAdmin(){$("#admin").classList.remove("on");activity()}
function checkPin(){if($("#pin").value!==PIN){$("#perr").textContent=t("wrong");return}showStats()}
function showStats(){
  var f=store("fb"),n=store("nl").length,c=function(k,v){return f.filter(function(x){return x[k]===v}).length};
  var rows=[["a",t("q1")],["p",t("q2")],["s",t("q3")]].map(function(r){return '<p style="margin:6px 0"><b>'+esc(r[1])+'</b><br>🙂 '+c(r[0],2)+' &nbsp; 😐 '+c(r[0],1)+' &nbsp; 🙁 '+c(r[0],0)+'</p>'}).join("");
  var cm=[];f.forEach(function(x){[["ca","lblA"],["cp","lblP"],["cs","lblS"],["c","lblC"]].forEach(function(k){if(x[k[0]])cm.push('<li><b>'+t(k[1])+':</b> '+esc(x[k[0]])+'</li>')})});cm=cm.slice(-8).reverse().join("");
  $("#adminBox").innerHTML='<h2>Admin</h2><p>'+t("total")+': <b>'+f.length+'</b> · '+t("nlCount")+': <b>'+n+'</b></p>'+rows+'<p><b>'+t("lastC")+'</b></p><ul>'+cm+'</ul><button class="btn alt" onclick="try{localStorage.removeItem(\'fb\');localStorage.removeItem(\'nl\')}catch(e){}showStats()">'+t("wipe")+'</button> <button class="btn" onclick="closeAdmin()">'+t("close")+'</button>';
}

$("#attractT").textContent=t("attractT");$("#attractS").textContent=t("attractS");
activity();loadShop();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
