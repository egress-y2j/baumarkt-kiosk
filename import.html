<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import – Kiosk-Daten erstellen</title>
<style>
:root{--bg:#fff;--ink:#1f2a30;--line:#c9d0d3;--soft:#eef1f2}
@media (prefers-color-scheme:dark){:root{--bg:#182025;--ink:#eef1f2;--line:#3a4852;--soft:#25313a}}
body{font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;background:var(--bg);color:var(--ink)}
h1{font-size:26px;margin:0 0 6px}label{display:block;margin:14px 0 4px;font-weight:600}
input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;width:100%;background:var(--soft);color:inherit}
input[type=color]{width:80px;height:42px;padding:2px}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:inherit;cursor:pointer;margin:14px 8px 0 0}
button.p{background:#ffc400;border-color:#ffc400;color:#1f2a30;font-weight:600}button:disabled{opacity:.45}
.e{color:#d4372b}.w{color:#b87500}.o{color:#2a9548}pre{background:var(--soft);padding:12px;border-radius:8px;max-height:240px;overflow:auto;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:600px){.g{grid-template-columns:1fr}}
</style></head><body>
<h1>Kiosk-Daten erstellen</h1>
<p>Excel-Tabelle als <b>CSV UTF-8</b> speichern, hier auswählen, prüfen lassen und die fertige JSON-Datei herunterladen. Die Datei bleibt auf deinem Rechner, es wird nichts hochgeladen.</p>
<button id="tpl">Vorlage (CSV) herunterladen</button>
<div class="g">
<div><label for="id">Laden-Kennung (nur a–z, 0–9, Bindestrich)</label><input id="id" value="baumarkt-muster"></div>
<div><label for="nm">Name des Ladens</label><input id="nm" value="Baumarkt Muster"></div>
<div><label for="lg">Logo (ein Emoji)</label><input id="lg" value="🔧" maxlength="4"></div>
<div><label for="ac">Akzentfarbe</label><input id="ac" type="color" value="#ffc400"></div>
</div>
<label for="f">Produktliste (CSV)</label><input id="f" type="file" accept=".csv,.txt">
<div id="out"></div>
<button class="p" id="dl" disabled>JSON herunterladen</button>
<script>
var $=function(i){return document.getElementById(i)},DATA=null;
var AL={category:["kategorie","category","warengruppe"],name:["name","artikel","produkt","bezeichnung"],description:["beschreibung","description","text"],price:["preis","price"],aisle:["gang","aisle","regal"],icon:["icon","symbol"]};
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function parse(t){t=t.replace(/^\uFEFF/,"");var first=t.split(/\r?\n/)[0],d=";";[";",",","\t"].forEach(function(c){if(first.split(c).length>first.split(d).length)d=c});
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";rows.push(row);row=[]}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return x.trim()})})}
function price(v){v=v.replace(/[€\s]/g,"");if(/^\d+([.,]\d{1,2})?$/.test(v)){var n=parseFloat(v.replace(",","."));return n.toFixed(2).replace(".",",")}return v}
function build(text){
  var E=[],W=[],rows=parse(text);if(rows.length<2){return {E:["Die Datei enthält keine Produktzeilen."],W:[],D:null}}
  if(text.indexOf("\uFFFD")>-1)W.push("Sonderzeichen sind kaputt: in Excel als „CSV UTF-8“ speichern.");
  var head=rows[0].map(function(h){return h.trim().toLowerCase()}),ix={};
  Object.keys(AL).forEach(function(k){ix[k]=head.findIndex(function(h){return AL[k].indexOf(h)>-1})});
  ["category","name","price","aisle"].forEach(function(k){if(ix[k]<0)E.push("Spalte fehlt: "+AL[k][0]+" (Pflicht: Kategorie, Name, Preis, Gang)")});
  if(E.length)return {E:E,W:W,D:null};
  var cats=[],prods=[],seen={},get=function(r,k){return ix[k]<0?"":(r[ix[k]]||"").trim()};
  rows.slice(1).forEach(function(r,n){var line=n+2,c=get(r,"category"),nm=get(r,"name"),pr=price(get(r,"price")),g=get(r,"aisle");
    var miss=[];if(!c)miss.push("Kategorie");if(!nm)miss.push("Name");if(!pr)miss.push("Preis");if(!g)miss.push("Gang");
    if(miss.length){E.push("Zeile "+line+": fehlt "+miss.join(", "));return}
    if(!/^\d+([.,]\d{2})?$/.test(pr))W.push("Zeile "+line+": Preis „"+pr+"“ ungewöhnlich");
    var key=c+"|"+nm.toLowerCase();if(seen[key])W.push("Zeile "+line+": „"+nm+"“ kommt doppelt in „"+c+"“ vor");seen[key]=1;
    var ci=cats.findIndex(function(x){return x.name===c});if(ci<0){cats.push({name:c,icon:get(r,"icon")||"📦"});ci=cats.length-1}
    else if(!cats[ci].icon||cats[ci].icon==="📦"){var ic=get(r,"icon");if(ic)cats[ci].icon=ic}
    prods.push({name:nm,category:c,price:pr,description:get(r,"description"),aisle:g})});
  if(cats.length>12)W.push(cats.length+" Kategorien sind viele für eine Kachelansicht.");
  var hex=$("ac").value,l=(parseInt(hex.substr(1,2),16)*.299+parseInt(hex.substr(3,2),16)*.587+parseInt(hex.substr(5,2),16)*.114);
  return {E:E,W:W,D:{name:$("nm").value.trim(),logo:$("lg").value.trim(),accent:hex,accentText:l>150?"#1f2a30":"#ffffff",categories:cats,products:prods}}}
function run(){var f=$("f").files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){
  var r=build(rd.result),id=$("id").value.trim(),h="";DATA=null;$("dl").disabled=true;
  if(!/^[a-z0-9-]+$/.test(id))r.E.push("Laden-Kennung: nur Kleinbuchstaben, Ziffern und Bindestrich.");
  r.E.forEach(function(x){h+='<p class="e">✖ '+esc(x)+'</p>'});r.W.forEach(function(x){h+='<p class="w">⚠ '+esc(x)+'</p>'});
  if(!r.E.length&&r.D){DATA=r.D;$("dl").disabled=false;h='<p class="o">✔ '+r.D.products.length+' Produkte in '+r.D.categories.length+' Kategorien, '+new Set(r.D.products.map(function(p){return p.aisle})).size+' Gänge.</p>'+h+'<pre>'+esc(JSON.stringify(r.D,null,1).slice(0,1500))+' …</pre>'}
  $("out").innerHTML=h};rd.readAsText(f,"UTF-8")}
["f","id","nm","lg","ac"].forEach(function(i){$(i).addEventListener("change",run)});
function save(name,txt,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;a.click()}
$("dl").onclick=function(){if(DATA)save($("id").value.trim()+".json",JSON.stringify(DATA,null,1),"application/json")};
$("tpl").onclick=function(){save("vorlage.csv","\uFEFFKategorie;Name;Beschreibung;Preis;Gang;Icon\r\nWerkzeug;Hammer 300 g;Eschenstiel, geschmiedeter Kopf.;12,50;1;🔨\r\nGarten;Gartenschlauch 20 m;Knickfest, mit Spritzpistole.;24,90;3;🌱\r\n","text/csv")};
</script></body></html>
